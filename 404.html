        // Score each known page against the words in the requested path and
        // offer the best few, so a typo or dead link still lands somewhere.
        (function suggest() {
            const raw = decodeURIComponent(location.pathname).toLowerCase();
            const words = raw.split(/[^a-z0-9]+/).filter(w => w.length > 2 &&
                !['generators', 'blog', 'html', 'name', 'the', 'www'].includes(w));
            if (!words.length || !PAGES.length) return;

            // Someone who asked for /generators/... almost certainly wants a
            // generator, so matches in the same section rank above the rest.
            const section = raw.split('/').filter(Boolean)[0] || '';

            const scored = PAGES.map(p => {
                const hay = (p.u + ' ' + p.t).toLowerCase();
                let score = 0;
                words.forEach(w => {
                    if (hay.includes(w)) score += w.length;
                    else if (w.length > 4 && hay.includes(w.slice(0, -1))) score += w.length - 2;
                });
                if (score > 0 && section && p.u.startsWith('/' + section)) score += 6;
                return {p, score};
            }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 4);

            if (!scored.length) return;
            const list = document.getElementById('suggestionList');
            list.innerHTML = scored.map(x =>
                '<li><a href="' + x.p.u + '"></a></li>').join('');
            [].forEach.call(list.querySelectorAll('a'), (a, i) => { a.textContent = scored[i].p.t; });
            document.getElementById('suggestions').hidden = false;
            if (typeof gtag === 'function') gtag('event', 'not_found_suggestions', {path: raw, matches: scored.length});

        const suffixes = ['or','us','in','an','ar','ion','ius','orn','ald','ric','a','ia','wen','elle'];
        const r = a => a[Math.floor(Math.random() * a.length)];
        function generateName() {
            let name = r(prefixes);
            if (Math.random() > 0.4) name += r(middles);
            name += r(suffixes);
            name = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
